# Every ```m2 block in the skill must execute against a real Macaulay2 kernel.
# M2 comes from the official Macaulay2 PPA for Ubuntu (the route documented at
# https://github.com/Macaulay2/M2/wiki/Installing-Macaulay2-in-Linux#ubuntu).
name: verify-skill

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly drift canary: PPA version vs pinned expectations

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Macaulay2 (official PPA)
        run: |
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2

      - name: Kernel version
        run: M2 --version

      - name: Verify every m2 block in the skill
        run: python3 tools/verify.py
